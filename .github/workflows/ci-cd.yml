name: CI and production images

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx --no-install prisma generate
      - run: npx --no-install prisma validate
      - run: npm run build
      - run: npm test -- --runInBand

  publish_images:
    name: Publish production images to Docker Hub
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo '::error::Missing DOCKERHUB_USERNAME secret'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo '::error::Missing DOCKERHUB_TOKEN secret'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            mormbathie/oumou-salamat-backend:${{ github.sha }}
            mormbathie/oumou-salamat-backend:latest
          build-args: APP_REVISION=${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            mormbathie/oumou-salamat-frontend:${{ github.sha }}
            mormbathie/oumou-salamat-frontend:latest
          build-args: |
            APP_REVISION=${{ github.sha }}
            VITE_API_URL=/api
            VITE_KEYCLOAK_URL=https://auth.57.131.160.254.sslip.io
            VITE_KEYCLOAK_REALM=oumou-salamat
            VITE_KEYCLOAK_CLIENT_ID=oumou-salamat-app

  deploy:
    name: Deploy frontend to Vercel
    needs: [frontend, backend]
    if: >-
      vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment credentials
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Build and deploy
        shell: bash
        run: |
          set -euo pipefail
          target=preview
          flags=()
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            target=production
            flags=(--prod)
          fi
          vercel pull --yes --environment="$target" --token="$VERCEL_TOKEN"
          vercel build "${flags[@]}" --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt "${flags[@]}" --token="$VERCEL_TOKEN" > /tmp/vercel-url.txt
          printf 'Deployment: %s\n' "$(cat /tmp/vercel-url.txt)" >> "$GITHUB_STEP_SUMMARY"
